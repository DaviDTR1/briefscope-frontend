<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>BriefScope</title>
    <script>
      // ROOT_PATH = the part before /ui in the URL.
      // /api/briefscope_cloud/ui/...  →  /api/briefscope_cloud
      // /ui/...                       →  ''  (local / standalone)
      const match = window.location.pathname.match(/^(\/api\/[^/]+)(?=\/ui)/);
      window.__ROOT_PATH__ = match ? match[1] : '';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
